name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload artifacts to GitHub Release tag (e.g. v2.0.0)"
        required: false
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve tag / version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.upload_release }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # strip leading v for filename suffix, keep TAG for gh release
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved TAG=$TAG VER=$VER"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd frontend && npm ci && cd ..
          wails build -platform linux/amd64 -o AIGateway

      - name: Package tarball
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          mkdir -p dist
          BIN="build/bin/AIGateway"
          test -f "$BIN" || BIN="build/bin/AIGateway"
          cp "$BIN" dist/AIGateway
          chmod +x dist/AIGateway
          tar -C dist -czf "AIGateway-v${VER}-linux-amd64.tar.gz" AIGateway
          shasum -a 256 "AIGateway-v${VER}-linux-amd64.tar.gz" | tee SHA256SUMS-linux.txt
          ls -lh "AIGateway-v${VER}-linux-amd64.tar.gz"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIGateway-linux-amd64
          path: |
            AIGateway-v*-linux-amd64.tar.gz
            SHA256SUMS-linux.txt

      - name: Attach to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.ver }}"
          gh release upload "$TAG" "AIGateway-v${VER}-linux-amd64.tar.gz" --clobber

name: ❓ 使用问答 / Question
description: 使用方式、配置或兼容性问题（非 Bug）
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前可先看 [README](https://github.com/vincent1986/AIGateway#readme) 与 [Releases](https://github.com/vincent1986/AIGateway/releases)。

  - type: dropdown
    id: topic
    attributes:
      label: 主题 / Topic
      options:
        - 安装与启动
        - 厂家 / API 配置
        - 模型组与 Failover
        - 应用接管（ChatGPT / Claude Code 等）
        - 网关地址与端口
        - 其他
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 问题 / Question
      description: 你想达成什么？已经试过什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AIGateway 版本 / Version（可选）
      placeholder: "v2.0.0"

  - type: textarea
    id: env
    attributes:
      label: 环境信息（可选）
      description: 系统、关联工具、厂家名称等

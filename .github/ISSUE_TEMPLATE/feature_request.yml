name: ✨ 功能建议 / Feature Request
description: 提出新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！描述越具体，越容易评估与实现。
        Feature ideas are welcome — concrete use cases help a lot.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 已搜索现有 Issues，确认没有重复 / I searched existing issues and this is not a duplicate
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关模块 / Area
      options:
        - 厂家管理 / Providers
        - 模型管理 / Models
        - 应用接管 / App takeover
        - 统一入口 / Gateway
        - Token 统计 / Usage
        - 多语言 / i18n
        - 安装打包 / Packaging
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 当前痛点是什么？
      placeholder: 例如：切换厂家后需要手动改多个工具的配置...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你希望产品怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你考虑过的其他做法（可选）

  - type: textarea
    id: context
    attributes:
      label: 其他说明 / Additional context
      description: 截图、参考产品、使用场景等

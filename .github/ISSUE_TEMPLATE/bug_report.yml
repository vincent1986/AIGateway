name: 🐛 Bug 报告 / Bug Report
description: 报告程序错误、崩溃或不符合预期的行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，方便快速定位问题。
        Thanks for the report. Please fill in as much as you can.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 已搜索现有 Issues，确认没有重复 / I searched existing issues and this is not a duplicate
          required: true
        - label: 已尝试最新 Release / I tried the latest release
          required: false

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统 / OS
      description: 出问题的环境
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - 其他 / Other
      multiple: true
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AIGateway 版本 / Version
      description: 例如 v2.0.0，或关于页 / 文件名中的版本号
      placeholder: "v2.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题模块 / Area
      options:
        - 厂家管理 / Providers
        - 模型管理 / Models
        - 应用接管 / App takeover
        - 统一入口 / Gateway
        - Token 统计 / Usage
        - 安装与启动 / Install & launch
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / What happened
      description: 实际发生了什么？期望是什么？
      placeholder: |
        实际：...
        期望：...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息（可选）
      description: 可粘贴终端输出、网关响应、截图说明等。请打码 API Key。
      render: text

  - type: textarea
    id: context
    attributes:
      label: 其他信息 / Additional context
      description: 关联工具（ChatGPT / Claude Code / OpenClaw 等）、厂家、模型名等
